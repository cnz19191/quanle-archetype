server:
  port: 8080

spring:
  application:
    name: isiniu-single-demo
  datasource:
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/isiniu_single?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME:isiniu}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      tableOptions: " ENGINE=InnoDB DEFAULT CHARSET=utf8mb4"
      updateTimeOnUpdate: " ON UPDATE CURRENT_TIMESTAMP"

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

isiniu:
  web:
    # 上线前必须换成具体域名，不要保留 *
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  auth:
    # local：内置账号密码登录；sso：校验外部 OIDC JWT
    mode: ${AUTH_MODE:local}
    issuer: isiniu-single-demo
    # LOCAL 模式必填，至少 32 字节，不要写进配置文件
    jwt-secret: ${AUTH_JWT_SECRET:}
    access-token-ttl: 30m
    refresh-token-ttl: 7d
    permit-paths:
      - /api/auth/login
      - /api/auth/refresh
      - /api/health
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /actuator/health
      - /error
    sso:
      issuer-uri: ${AUTH_SSO_ISSUER_URI:}
      jwk-set-uri: ${AUTH_SSO_JWK_SET_URI:}
      user-id-claim: sub
      roles-claim: roles
      auto-provision: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{50} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
